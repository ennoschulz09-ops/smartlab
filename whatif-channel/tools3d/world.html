  },
  walk_wide(s) { // 3: Pip laeuft zum Auto
    const lt = s.lt, t = s.t; rest(hero); rest(sales); mainCar.position.set(...CAR_P); mainCar.rotation.y = Math.PI;
    const x = lerp(9.4, 4.6, sm(lt / 2.1)); hero.root.position.set(x, 0, 2.3); hero.root.rotation.y = -Math.PI / 2 - 0.12; walk(hero, t, 6.5);
    place(sales, [-1.7, 0, 0.3], [3, 0, 3]); sales.arms[0].sh.rotation.z = 0.15; sales.arms[1].sh.rotation.z = -0.15; idle(sales, t, 0.7, 0.6);

    lighting(L_BACK); sunBehind(c.p, [-3, 3, -8], [0, 1, 0]);
    drawFace(sales.face, { lid: 0.1, brow: [-4, -4], mouth: 'smile' }); drawFace(hero.face, { lid: 0.45, brow: [4, 4], mouth: 'smile', look: [-0.8, 0] });

  },
  pat_hood(s) { // 4: Verkaeufer klopft auf die Motorhaube, Pip daneben
    const lt = s.lt, t = s.t; rest(hero); rest(sales); mainCar.position.set(...CAR_P); mainCar.rotation.y = Math.PI;
    place(sales, [-1.5, 0, 0.1], [2, 0, 0.1]); const pat = Math.abs(Math.sin(t * 6)) * 0.2; sales.arms[0].sh.rotation.set(-1.2 + pat, 0, 0); sales.arms[0].el.rotation.set(-0.45, 0, 0); sales.arms[1].sh.rotation.z = -0.3; idle(sales, t, 0.4, 0.6);
    place(hero, [3.6, 0, 2.8], [-1.5, 0, 0.1], 0.9); pockets(hero); idle(hero, t, 1.1);
    const c = keys(lt, [{ t: 0, p: [3.4, 3.1, 11.4], l: [0.8, 2.9, 0.8], fov: 31 }, { t: 2.4, p: [2.8, 3.1, 10.4], l: [0.6, 3.0, 0.8], fov: 30 }]); setCam(c);
    lighting(L_BACK); sunBehind(c.p, [-2, 3, -8], [3, 1, 0]);

  ots_pitch(s) { // 5: ueber Pips Schulter, Verkaeufer luegt

    const c = keys(lt, [{ t: 0, p: [-4.6, 3.9, 8.6], l: [1.8, 3.2, -1.2], fov: 25, roll: -2 }, { t: 2.1, p: [-4.2, 3.9, 7.7], l: [2.0, 3.2, -1.4], fov: 24, roll: -3 }]); setCam(c);

  pip_report(s) { // 7: Pip haelt den Bericht hoch
    const lt = s.lt, t = s.t; rest(hero); sales.root.visible = false; mainCar.position.set(5.0, 0, -7); mainCar.rotation.y = Math.PI;

    hero.root.updateMatrixWorld(true); const hp = new THREE.Vector3(); hero.arms[1].hand.getWorldPosition(hp); paper.visible = true; paper.position.set(hp.x + 0.55, hp.y + 0.45, hp.z + 0.5); paper.rotation.set(0, -0.15, -0.06); const k = sm((lt - 0.2) / 0.4); paper.scale.setScalar(0.3 + 0.55 * k);

  sales_crack(s) { // 8: Verkaeufer schwitzt (ueber Pips Schulter)
    const lt = s.lt, t = s.t; rest(hero); rest(sales); mainCar.position.set(3.0, 0, -5); mainCar.rotation.y = Math.PI;

    place(sales, [1.4, 0, -1.2], [-3.6, 0, 8]); sales.arms[0].sh.rotation.set(-0.7, 0, 0.5); sales.arms[1].sh.rotation.set(-0.7, 0, -0.5); idle(sales, t, 0.2, 0.4);
    const sw = Math.min(1, lt / 0.9);
    const c = keys(lt, [{ t: 0, p: [-4.2, 3.9, 8.4], l: [1.2, 3.3, -0.8], fov: 25, roll: -2 }, { t: 1.4, p: [-3.8, 3.9, 7.6], l: [1.2, 3.35, -0.9], fov: 24, roll: -3 }]); setCam(c);
    lighting(L_BACK); sunBehind(c.p, [4, 3, -6], [0, 1, 0]);
    drawFace(sales.face, { lid: 0.0, brow: [-22, -22], rise: [10 + 6 * sw, 10 + 6 * sw], mouth: lt > 0.5 ? 'frown' : 'smile', look: [0.9, 0.3], sweat: sw });
    return { focus: cam.position.distanceTo(headPos(sales)) };
  },
  price_drop(s) { // 9: Preisschild faellt
    const lt = s.lt, t = s.t; rest(hero); rest(sales); mainCar.position.set(2.2, 0, -0.6); mainCar.rotation.y = Math.PI; paper.visible = false;
    board.position.set(0.2, 0, 1.6); board.rotation.y = 0.15; drawBoard(s.ev.price >= 0 ? s.ev.price / 0.5 : 0);
    place(sales, [-2.4, 0, 0.4], [3, 0, 3]); sales.arms[0].sh.rotation.set(0.1, 0, 0.5); sales.arms[1].sh.rotation.set(0.1, 0, -0.5); sales.head.rotation.x = 0.0;
    place(hero, [4.3, 0, 2.2], [0.4, 0, 1.6], 0.95); pockets(hero); idle(hero, t, 0.7, 0.6);
    const c = keys(lt, [{ t: 0, p: [6.2, 3.0, 10.8], l: [1.6, 2.9, 0.8], fov: 31, roll: 1.5 }, { t: 2.9, p: [5.4, 3.0, 9.8], l: [1.5, 2.9, 0.8], fov: 30, roll: 2.5 }]); setCam(c);
    lighting(L_BACK); sunBehind(c.p, [-3, 3, -8], [2, 1, 0]);
    drawFace(sales.face, { lid: 0.2, brow: [-14, -14], rise: [6, 6], mouth: 'frown', look: [0.6, -0.4] }); drawFace(hero.face, { lid: 0.4, brow: [4, 4], mouth: 'smile', look: [-0.9, 0] });

  hero_end(s) { // 10: Pip im Gegenlicht
    const lt = s.lt, t = s.t; rest(hero); sales.root.visible = false; mainCar.position.set(4.5, 0, -8); mainCar.rotation.y = Math.PI; paper.visible = false;
    place(hero, [0, 0, 0], [3, 0, 6], -0.25 + sm(lt / 1.2) * 0.45); pockets(hero); idle(hero, t, 0.2, 0.8);
    const c = keys(lt, [{ t: 0, p: [0.6, 3.1, 6.6], l: [0, 3.15, 0], fov: 36, roll: 1.5 }, { t: 2.2, p: [0.3, 3.2, 5.2], l: [0, 3.25, 0], fov: 33, roll: 2 }]); setCam(c);
    lighting({ ...L_BACK, ri: 2.4, ki: 3.8 }); sunBehind(c.p, [0, 3.4, 0], [-0.6, 0.4, 0]);

  title_card(s) { // 11: Titelkarte, Autohof-Silhouette, Pip klein
    const lt = s.lt, t = s.t; rest(hero); sales.root.visible = false; paper.visible = false; mainCar.position.set(-1, 0, -2); mainCar.rotation.y = Math.PI;
    place(hero, [3.6, 0, 4.8], [-4, 0, -30]); pockets(hero); idle(hero, t, 0.3, 0.5);
    const c = keys(lt, [{ t: 0, p: [1.0, 2.6, 17], l: [-0.5, 5.2, 0], fov: 38 }, { t: 3.0, p: [0.6, 2.7, 15.5], l: [-0.5, 5.3, 0], fov: 38 }]); setCam(c);
    lighting({ ...L_BACK, ki: 2.2, hi: 1.0 }); sunBehind(c.p, [-0.5, 5.6, 0], [0, -0.5, 0]);

  tease(s) { // 12: Pip nah, Glocke laeutet lauter
    const lt = s.lt, t = s.t; rest(hero); sales.root.visible = false; paper.visible = false; mainCar.position.set(5, 0, -6); mainCar.rotation.y = Math.PI;
    place(hero, [0, 0, 0], [1, 0, 6]); pockets(hero); idle(hero, t, 0.2, 0.6);
    const c = keys(lt, [{ t: 0, p: [1.0, 3.4, 6.2], l: [0, 3.1, 0], fov: 30 }, { t: 3.0, p: [0.5, 3.35, 5.3], l: [0, 3.1, 0], fov: 28 }]); setCam(c);
    lighting({ ...L_BACK, ki: 2.6, hi: 1.0 }); sunBehind(c.p, [0, 3.4, 0], [-1, 0.2, 0]);
    const sad = Math.min(1, lt / 1.0); drawFace(hero.face, { lid: 0.3 + 0.25 * sad, brow: [-14 * sad, -14 * sad], rise: [6 * sad, 6 * sad], mouth: sad > 0.5 ? 'flat' : 'smile', look: [0, 0.2] });

};

window.renderFrame = (s) => {
  sales.root.visible = true; hero.root.visible = true; paper.visible = false; tag.visible = false; board.visible = (s.shot === 'price_drop');
  const r = SHOTS[s.shot](s);
  const tp = r.tagTarget ? bellTag(r.tagTarget, r.tagAge) : bellTag(null, -1); if (!r.tagTarget) { rings.forEach(x => x.material.opacity = 0); tagGlow.intensity = 0; }
  bokeh.uniforms.focus.value = r.focus; bokeh.uniforms.aperture.value = r.aperture ?? 0.00032; bloom.strength = s.bloom ?? 0.28;
  grade.uniforms.vig.value = 0.5; grade.uniforms.fade.value = s.fade ?? 1.0;
  hero.root.updateMatrixWorld(true); sales.root.updateMatrixWorld(true);
  comp.render();
  const pr = (v) => { const q = v.clone().project(cam); return [(q.x * 0.5 + 0.5) * W, (-q.y * 0.5 + 0.5) * H]; };
  return { hero: pr(headPos(hero)), sales: pr(headPos(sales)), tag: tp ? pr(tp) : null };
};
window.ready = true;
</script></body></html>
