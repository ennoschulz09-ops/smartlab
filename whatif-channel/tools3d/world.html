<body><script type="module">

const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...o });

const rim = new THREE.DirectionalLight(0xff6fb8, 1.3); scene.add(rim);

// ---------------------------------------------------------------- Glocken-Buehne
const bellStage = new THREE.Group(); scene.add(bellStage);
const goldMat = new THREE.MeshStandardMaterial({ color: 0xffc23a, metalness: 0.92, roughness: 0.24, envMapIntensity: 1.5 });
const bellG = new THREE.Group(); bellStage.add(bellG);
const prof = [[0.2, -0.38], [1.18, -0.38], [1.18, -0.3], [1.08, -0.2], [0.86, 0.15], [0.74, 0.7], [0.64, 1.25], [0.44, 1.78], [0.2, 1.98], [0.0, 2.02]].map(([x, y]) => new THREE.Vector2(x, y));
const bell = new THREE.Mesh(new THREE.LatheGeometry(prof, 64), new THREE.MeshStandardMaterial({ color: 0xffc23a, metalness: 0.92, roughness: 0.24, envMapIntensity: 1.5, side: THREE.DoubleSide })); bell.castShadow = true; bellG.add(bell);
const rimT = new THREE.Mesh(new THREE.TorusGeometry(1.14, 0.075, 16, 64), goldMat); rimT.rotation.x = Math.PI / 2; rimT.position.y = -0.34; bellG.add(rimT);

const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 9, 8), M(0x6a4a2a)); rope.position.set(0, 7.0, 0); bellStage.add(rope);

const rings = []; for (let i = 0; i < 4; i++) { const m = new THREE.Mesh(new THREE.TorusGeometry(1, 0.025, 8, 80), new THREE.MeshBasicMaterial({ color: 0xffd36a, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); m.position.y = 0.9; bellStage.add(m); rings.push(m); }

const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), M(0x5c4a7e)); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; lot.add(ground);

const skyC = document.createElement('canvas'); skyC.width = 8; skyC.height = 256; { const g = skyC.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#3a2a78'); gr.addColorStop(0.45, '#c25a9c'); gr.addColorStop(0.8, '#ff9a8a'); gr.addColorStop(1, '#ffd2a0'); g.fillStyle = gr; g.fillRect(0, 0, 8, 256); }

const sky = new THREE.Mesh(new THREE.PlaneGeometry(160, 70), new THREE.MeshBasicMaterial({ map: skyT, fog: false })); sky.position.set(0, 28, -40); lot.add(sky);

const roofC = document.createElement('canvas'); roofC.width = 512; roofC.height = 96; { const g = roofC.getContext('2d'); g.fillStyle = '#d83a4a'; g.fillRect(0, 0, 512, 96); g.fillStyle = '#fff'; g.font = '900 64px Arial Black, Arial'; g.textAlign = 'center'; g.fillText('AUTO SALES', 256, 70); }

const sign = new THREE.Mesh(new THREE.BoxGeometry(10, 1.1, 0.3), new THREE.MeshBasicMaterial({ map: roofT })); sign.position.set(-7, 5.2, -13.8); lot.add(sign);
for (let i = 0; i < 6; i++) { const w = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 2), new THREE.MeshBasicMaterial({ color: 0xffd9a0 })); w.position.set(-13 + i * 2.5, 2, -13.98); lot.add(w); }
function makeCar(color) {

for (let i = 0; i < 26; i++) { const x = -13 + i, y = 6.2 - Math.sin(i / 25 * Math.PI) * 1.2; const b = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), new THREE.MeshBasicMaterial({ color: i % 2 ? 0xffe2a0 : 0xffb0d0 })); b.position.set(x, y, -4); lot.add(b); }

const paperC = document.createElement('canvas'); paperC.width = 400; paperC.height = 520; { const g = paperC.getContext('2d'); g.fillStyle = '#fbfbf8'; g.fillRect(0, 0, 400, 520); g.fillStyle = '#4a5068'; g.font = '800 44px Arial'; g.textAlign = 'center'; g.fillText('VEHICLE', 200, 90); g.fillText('REPORT', 200, 140);

  rim.color.set(p.rc); rim.intensity = p.ri; rim.position.set(...p.rp); fill.intensity = p.fi; fill.position.set(...p.fp);

const LIT = {
  bell: { hc: 0x6fb4ff, hg: 0x10305a, hi: 0.9, kc: 0x9fdcff, ki: 1.2, kp: [-4, 12, 6], kt: [0, 0, 0], rc: 0xffb050, ri: 1.6, rp: [5, 5, -6], fi: 0.35, fp: [-3, 2, 8], bg: 0x06182f, fn: 10, ff: 34 },
  dusk: { hc: 0xd9b8ff, hg: 0x8a5aa8, hi: 1.7, kc: 0xffd0a0, ki: 2.6, kp: [-8, 9, 8], kt: [0, 0, 0], rc: 0xff6fb8, ri: 1.6, rp: [6, 4, -8], fi: 1.0, fp: [-2, 4, 10], bg: 0xc06a9a, fn: 22, ff: 60 },
};

function ringPulse(age, color, base = 0) { rings.forEach((m, i) => { const a = age - i * 0.2; if (a < 0 || a > 1.8) { m.material.opacity = 0; return; } const s = 1.3 + a * 3.6; m.scale.set(s, s, s); m.material.opacity = Math.pow(1 - a / 1.8, 1.5) * 0.9; m.material.color.set(color); }); }

// ---------------------------------------------------------------- Einstellungen
const SHOTS = {

    bellG.rotation.z = sw; bellG.position.set(0, 1.2, 0); clap.position.x = Math.sin(a * 6.4 + 0.6) * 0.1 * (a >= 0 ? Math.exp(-a) : 0);

    ringPulse(a, 0xffd36a); return { focus: cam.position.distanceTo(new THREE.Vector3(0, 1.5, 0)), bloom: 0.55, vig: 0.6 };
  },
  bell_close(s) {
    show('bell'); setLights(LIT.bell); hero.root.visible = sales.root.visible = false; paper.visible = false;
    const lt = s.lt, a = s.ev.bong2 ?? -1; const sw = a >= 0 ? 0.2 * Math.exp(-a * 0.7) * Math.sin(a * 4.2) : 0;
    bellG.rotation.z = sw; bellG.position.set(0, 1.2, 0);
    const ang = -0.5 + lt * 0.16; cam.position.set(Math.sin(ang) * 9.0, -0.1 + lt * 0.12, Math.cos(ang) * 9.0); cam.lookAt(0, 1.1 + lt * 0.05, 0);

  },
  lot_two(s) {

    idle(sales, t, 0.4); idle(hero, t, 1.7);
    const sh = s.shake || 0; cam.position.set(1.5 + lt * 0.12 + Math.sin(t * 95) * sh, 2.6 + Math.cos(t * 83) * sh, 9.8 - lt * 0.25); cam.lookAt(1.5, 2.4, 0);
    drawFace(sales.face, { lid: 0.1, brow: [-6, -6], rise: [10, 10], mouth: 'open', open: s.sp.sales || 0, look: [0.8, 0.4] });
    drawFace(hero.face, { lid: s.ev.lie >= 0 ? 0.6 : 0.4, brow: s.ev.lie >= 0 ? [10, -6] : [0, 0], rise: [0, s.ev.lie >= 0 ? 8 : 0], mouth: s.ev.lie >= 0 ? 'smirk' : 'smile', look: [-0.6, 0] });
    return { focus: cam.position.distanceTo(new THREE.Vector3(0, 2.2, 0)) + 1, bloom: 0.2, vig: 0.5 };
  },
  hero_close(s) {

    const lt = s.lt, t = s.t; rest(hero); mainCar.position.set(6, 0, -14);

  },

    show('lot'); setLights(LIT.dusk); hero.root.visible = false; sales.root.visible = true; paper.visible = false; glow.intensity = 0;

window.renderFrame = (s) => {
  const r = SHOTS[s.shot](s);
  bokeh.uniforms.focus.value = r.focus; bokeh.uniforms.aperture.value = r.aperture ?? 0.0007; bloom.strength = r.bloom ?? 0.3; grade.uniforms.vig.value = r.vig ?? 0.55;

};
